name: Build

on:
  push:
    branches:
      - 'master'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
      - README.md

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          qt6-base-dev \
          qt6-base-dev-tools \
          qt6-webengine-dev \
          libkf6coreaddons-dev \
          libkf6globalaccel-dev \
          libkf6windowsystem-dev \
          liblayershellqtinterface-dev
    - run: npm ci
      working-directory: ./renderer
    - run: npm run make-index-files
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - run: qmake6 exiled-exchange-native.pro -o Makefile
      working-directory: ./native
    - run: make -j"$(nproc)"
      working-directory: ./native
    - uses: actions/upload-artifact@v7
      with:
        name: exiled-exchange-native-linux
        path: ./native/exiled-exchange-native
        retention-days: 7
